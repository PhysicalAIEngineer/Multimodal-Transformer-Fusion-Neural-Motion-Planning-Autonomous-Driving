name: Production Validation
on:
  push:
    branches: [main, production-ready]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-api.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-api.txt
      - name: Lint
        run: python -m ruff check production tests
      - name: Compile
        run: python -m compileall -q production "Helper Scripts"
      - name: Unit tests
        run: python -m pytest -q
